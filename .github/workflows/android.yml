name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    name: Check and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: 3.47.5
      FLUTTER_REVISION: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
      FLUTTER_ARCHIVE_SHA256: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js for diagnostic receiver tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl --fail --location --retry 3 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$FLUTTER_ARCHIVE_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare Android SDK and build resources
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/afterword-android-user"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
          org.gradle.workers.max=2
          org.gradle.daemon=false
          PROPERTIES
          printf 'sdk.dir=%s\nflutter.sdk=%s/flutter\n' "$ANDROID_HOME" "$RUNNER_TEMP" > android/local.properties
          flutter --version
          java -version

      - name: Restore trusted main signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: signing
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$ANDROID_USER_HOME"
            keystore="$ANDROID_USER_HOME/debug.keystore"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            signer_sha256=$(keytool -exportcert -keystore "$keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
            echo "signer_sha256=$signer_sha256" >> "$GITHUB_OUTPUT"
            echo 'mode=fixed-personal-test' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=temporary-test' >> "$GITHUB_OUTPUT"
            echo '::warning::No fixed signing secret: this APK may not upgrade an existing installation.'
          fi

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run project checks and build
        run: bash tool/check.sh android

      - name: Test diagnostic receiver
        run: node --test tool/diagnostics_receiver.test.mjs

      - name: Package APK and verification metadata
        id: package
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode || 'temporary-test' }}
          EXPECTED_SIGNER_SHA256: ${{ steps.signing.outputs.signer_sha256 }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]
          mkdir -p dist/ci-build
          apk="Afterword-${version}-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ci-build/$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "dist/ci-build/$apk" > dist/ci-build/SIGNATURE.txt
          if [[ "$SIGNING_MODE" == fixed-personal-test ]]; then
            actual_signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/ci-build/SIGNATURE.txt)
            if [[ -z "$EXPECTED_SIGNER_SHA256" || "$actual_signer" != "$EXPECTED_SIGNER_SHA256" ]]; then
              echo '::error::APK signing certificate does not match the restored test keystore.'
              exit 1
            fi
          fi
          (
            cd dist/ci-build
            sha256sum "$apk" > SHA256SUMS.txt
          )
          printf 'Version: %s\nCommit: %s\nSigning: %s\nFlutter: %s\n' \
            "$version" "$GITHUB_SHA" "$SIGNING_MODE" "$FLUTTER_VERSION" > dist/ci-build/BUILD_INFO.txt
          echo "apk_path=dist/ci-build/$apk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK
        id: upload_apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.apk_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK checksum
        id: upload_checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/ci-build/SHA256SUMS.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload signing certificate information
        id: upload_signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/ci-build/SIGNATURE.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload build information
        id: upload_build_info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/ci-build/BUILD_INFO.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Show download links
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode || 'temporary-test' }}
          APK_URL: ${{ steps.upload_apk.outputs.artifact-url }}
          CHECKSUM_URL: ${{ steps.upload_checksum.outputs.artifact-url }}
          SIGNATURE_URL: ${{ steps.upload_signature.outputs.artifact-url }}
          BUILD_INFO_URL: ${{ steps.upload_build_info.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo '### Android 安装包下载'
            echo "- [下载安装包（APK）]($APK_URL)"
            echo "- [下载 SHA-256 校验文件]($CHECKSUM_URL)"
            echo "- [下载签名证书信息]($SIGNATURE_URL)"
            echo "- [下载构建信息]($BUILD_INFO_URL)"
            echo
            echo '请先登录 GitHub。以上文件分别下载，APK 无需解压。'
            echo "- Version: $VERSION"
            echo "- Commit: $GITHUB_SHA"
            echo "- Signing: $SIGNING_MODE"
            if [[ "$SIGNING_MODE" == temporary-test ]]; then
              echo '临时测试签名可能无法覆盖旧版，请先备份数据。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
