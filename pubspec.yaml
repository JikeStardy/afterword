name: readlater
description: Local-first personal research library with RSS and bounded AI agents.
publish_to: none
version: 0.2.0+2
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  html: ^0.15.7
  xml: ^7.0.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  sqlite3: ^3.6.0
  archive: ^4.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
